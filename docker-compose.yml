services:

  postgres:
    image: postgres:18
    container_name: seat-reservation-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: seat_reservation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d seat_reservation"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: seat-reservation-service
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      PORT: 8080

      DATABASE_URL: jdbc:postgresql://postgres:5432/seat_reservation
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres

      DB_POOL_SIZE: 20
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data: