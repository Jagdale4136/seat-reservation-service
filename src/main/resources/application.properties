spring.application.name=seat-reservation-service

server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Authentication is handled by BearerTokenAuthenticationFilter, so Spring's
# default generated-password user is not needed.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ==============================
# PostgreSQL
# ==============================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/seat_reservation}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Fixed-size pool. Every in-flight reservation holds one connection while it
# waits for row locks, so a hot-seat burst queues on the pool, not on Tomcat.
spring.datasource.hikari.pool-name=seat-reservation-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=10000

# ==============================
# JPA
# ==============================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==============================
# Flyway
# ==============================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==============================
# Actuator / metrics
# ==============================

management.endpoints.web.exposure.include=health,info,prometheus

management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

management.endpoint.health.group.liveness.include=livenessState

# Readiness must verify application + database
management.endpoint.health.group.readiness.include=readinessState,db

management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ==============================
# Logging
# ==============================

logging.level.root=INFO
logging.level.com.kiran.seatreservation=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] [%thread] %logger{36} - %msg%n

# For JSON logs in Docker/Render, set the env var
# LOGGING_STRUCTURED_FORMAT_CONSOLE=logstash (MDC fields such as correlationId are included).